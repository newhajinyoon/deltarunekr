<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나무</title>
    <base href="/">
    <style>
        @font-face {
            font-family: 'GalmuriMono11';
            src: url('assets/font/DeltaDotumKR.ttf') format('truetype');
            size-adjust: 200%;
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'GalmuriMono7';
            src: url('assets/font/GalmuriMono7.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'GalmuriMono11', 'Malgun Gothic', sans-serif;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
        }

        body.pixel-mode {
            font-family: 'GalmuriMono7', sans-serif;
        }

        body.pixel-mode #dialogue-box {
            border-width: 6px; 
        }

        #tree-image {
            width: 300px;
            transition: transform 0.2s;
            image-rendering: pixelated;
        }

        #tree-image:active {
            transform: scale(0.98);
        }

        #dialogue-box {
            position: absolute;
            bottom: 50px;
            width: 80%;
            max-width: 600px;
            height: 150px;
            border: 2px solid #ffffff;
            background-color: #000000;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
        }

        #dialogue-text {
            font-size: 1.2rem;
            line-height: 1.6;
            white-space: pre-wrap;

            word-break: keep-all;

            padding-left: 1.4em;
            text-indent: -1.4em;
        }


        body.pixel-mode #dialogue-text {
            padding-left: 0;
            text-indent: 0;
        }

        .waiting::after {
            content: '▼';
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 1rem;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #choices-container {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .choice {
            font-size: 1.2rem;
            margin: 0 20px;
            color: #ffffff;
            transition: color 0.1s;
        }

        .choice:hover {
            color: #ffff00;
        }
    </style>
</head>
<body>

    <audio id="bgm" src="assets/media/man.mp3" loop></audio>
    <audio id="bgm2" src="assets/media/man2.mp3" loop></audio>
    <audio id="bgm3" src="assets/media/man3.mp3" loop></audio>
    <audio id="bgm4" src="assets/media/man4.mp3" loop></audio>
    <audio id="snd-egg" src="assets/media/egg.mp3"></audio>
    <audio id="snd-text" src="assets/media/snd_text.wav"></audio> <!-- 기본모드(갈무리11) 타이핑음 -->
    <audio id="snd-text-pixel" src="assets/media/snd_board_text_main.wav"></audio> <!-- 픽셀모드(갈무리7) 타이핑음 -->
    <audio id="snd-text-end" src="assets/media/snd_board_text_main_end.wav"></audio>

    <img id="tree-image" src="assets/images/tree.gif" alt="Tree">

    <div id="dialogue-box">
        <div id="dialogue-text"></div>
        <div id="choices-container"></div>
    </div>

    <script>
        window.reset = function() {
            localStorage.removeItem('gameState');
            location.reload();
        };

        const tree = document.getElementById('tree-image');
        const dBox = document.getElementById('dialogue-box');
        const dText = document.getElementById('dialogue-text');
        const choicesDiv = document.getElementById('choices-container');
        
        const bgm = document.getElementById('bgm');
        const bgm2 = document.getElementById('bgm2');
        const bgm3 = document.getElementById('bgm3');
        const bgm4 = document.getElementById('bgm4');
        const sndEgg = document.getElementById('snd-egg');
        const sndText = document.getElementById('snd-text');
        const sndTextPixel = document.getElementById('snd-text-pixel');
        const sndTextEnd = document.getElementById('snd-text-end');

        let gameState = parseInt(localStorage.getItem('gameState')) || 0;
        let isBgmPlaying = false;
        let isPixelMode = false; 
        
        let isTyping = false;
        let isWaitingForClick = false;
        let isChoiceActive = false;
        
        let currentShowArrow = true;
        let currentCallback = null;
        let typedText = "";
        let typeTimeout = null;
        let metaInfo = "";
        let timeInfo = "";

        let isFocusTrapActive = false;
        let isBetrayed = false;

        let sequenceQueue = [];
        let sequenceIdx = 0;

        async function fetchMetaInfo() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    const level = Math.floor(battery.level * 100);
                    if (level < 100) {
                        metaInfo = `${level} 남았다고 조급해하지 말렴.`;
                    }
                }
            } catch (e) {}
        }

        function fetchTimeInfo() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 5) {
                timeInfo = "벌써 늦은 새벽인데 잠들지 못했구나,";
            } else if (hour >= 5 && hour < 12) {
                timeInfo = "네 하루가 이제 막 시작되었겠구나,";
            } else if (hour >= 12 && hour < 18) {
                timeInfo = "나른한 오후네,";
            } else {
                timeInfo = "밤이 깊어가고 있네,";
            }
        }

        function handleLeave() {
            if (isFocusTrapActive) {
                isBetrayed = true;
            }
        }

        function handleReturn() {
            if (isFocusTrapActive && isBetrayed) {
                isFocusTrapActive = false; 
                
                clearTimeout(typeTimeout);
                isTyping = false;
                isChoiceActive = false;
                isWaitingForClick = false;
                choicesDiv.style.display = 'none';
                dBox.classList.remove('waiting');

                runSequence([
                    "나를 잊었구나.",
                    beVoid
                ]);
            }
        }

        window.addEventListener('blur', handleLeave);
        window.addEventListener('focus', handleReturn);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) handleLeave();
            else handleReturn();
        });

        function beVoid() {
            localStorage.setItem('gameState', '-1');
            document.body.innerHTML = ''; 
            document.body.style.backgroundColor = 'black';
        }

        function manLeaves(nextState) {
            localStorage.setItem('gameState', nextState.toString());
            gameState = nextState; 
            
            dBox.style.display = 'none';
            choicesDiv.style.display = 'none';
            dBox.classList.remove('waiting');
            isChoiceActive = false;
            isTyping = false;
            isWaitingForClick = false;
            currentCallback = null;
            clearTimeout(typeTimeout);

            document.body.classList.remove('pixel-mode');
            isPixelMode = false;
            tree.src = "assets/images/tree.gif";
            tree.style.display = '';

            [bgm, bgm2, bgm3, bgm4].forEach(audio => {
                if (audio && !audio.paused) {
                    let vol = audio.volume;
                    let fade = setInterval(() => {
                        if (vol > 0.1) {
                            vol -= 0.1;
                            audio.volume = vol;
                        } else {
                            audio.volume = 0;
                            audio.pause();
                            audio.volume = 1; 
                            clearInterval(fade);
                        }
                    }, 100);
                }
            });
            isBgmPlaying = false;
        }

        function typeWriter(text, showArrow = true) {
            isTyping = true;
            isChoiceActive = false;
            isWaitingForClick = false;
            currentShowArrow = showArrow;
            
            dBox.classList.remove('waiting');
            choicesDiv.style.display = 'none';
            dText.innerHTML = "";
            
            let i = 0;
            typedText = text.replace(/\^1/g, ''); 
            clearTimeout(typeTimeout);

            function typeNextChar() {
                if (!isTyping) return;
                if (i < text.length) {
                    if (text.substring(i, i+2) === '^1') {
                        i += 2;
                        typeTimeout = setTimeout(typeNextChar, 1000);
                        return;
                    }
                    
                    const char = text.charAt(i);
                    dText.innerHTML += char;
                    
                    if (char.trim() !== '') {
                        if (isPixelMode) {
                            sndTextPixel.currentTime = 0;
                            sndTextPixel.play().catch(()=>{});
                        } else {
                            sndText.currentTime = 0;
                            sndText.play().catch(()=>{});
                        }
                    }
                    i++;
                    typeTimeout = setTimeout(typeNextChar, 40);
                } else {
                    finishTyping();
                }
            }

            typeNextChar();
        }

        function finishTyping() {
            clearTimeout(typeTimeout);
            dText.innerHTML = typedText;
            isTyping = false;
            
            if (isPixelMode) {
                sndTextEnd.currentTime = 0;
                sndTextEnd.play().catch(()=>{});
            }

            if (currentShowArrow) {
                if (isPixelMode) {
                    dBox.classList.add('waiting');
                }
                isWaitingForClick = true; 
            } else {
                if (currentCallback) currentCallback();
            }
        }

        function showChoices(option1, option2, onOpt1, onOpt2) {
            isChoiceActive = true;
            choicesDiv.innerHTML = `
                <span class="choice" id="opt1">${option1}</span>
                <span class="choice" id="opt2">${option2}</span>
            `;
            choicesDiv.style.display = 'block';

            document.getElementById('opt1').onclick = (e) => { e.stopPropagation(); isChoiceActive = false; onOpt1(); };
            document.getElementById('opt2').onclick = (e) => { e.stopPropagation(); isChoiceActive = false; onOpt2(); };
        }

        function runSequence(seq) {
            sequenceQueue = seq;
            sequenceIdx = 0;
            nextSequence();
        }

        function nextSequence() {
            if (sequenceIdx >= sequenceQueue.length) return;
            const step = sequenceQueue[sequenceIdx++];
            
            if (typeof step === 'string') {
                currentCallback = nextSequence;
                typeWriter(step, true);
            } else if (typeof step === 'function') {
                step(); 
            } else if (typeof step === 'object') {
                currentCallback = () => showChoices(step.opt1, step.opt2, step.fn1, step.fn2);
                typeWriter(step.text, false); 
            }
        }

        document.body.addEventListener('click', () => {
            if (gameState === -1 || isChoiceActive) return;

            // 브금 재생 로직을 위로 올려 return에 막히지 않게 수정
            if (!isBgmPlaying && gameState === 0 && dBox.style.display !== 'none') {
                bgm.play().catch(()=>{});
                isBgmPlaying = true;
            }

            if (isTyping) {
                finishTyping();
                return;
            }

            if (isWaitingForClick && currentCallback) {
                isWaitingForClick = false;
                dBox.classList.remove('waiting');
                currentCallback();
                return;
            }

            if (gameState >= 1 && gameState <= 5 && (dBox.style.display === 'none' || dBox.style.display === '')) {
                dBox.style.display = 'flex';
                if (gameState <= 4) {
                    runSequence([
                        "* (음, 남자는 이제 여기 없다.)",
                        () => { dBox.style.display = 'none'; currentCallback = null; }
                    ]);
                } else if (gameState === 5) {
                    runSequence([
                        "* (음, 남자는 여기에 없다.)",
                        "* (... 허나, 크리스의 어깨엔, 여태껏 계속 묵직함이 맴돌고 있다.)",
                        "* (아스라이, 먼 저편에서부터 전해져 내려온 묵직함이...)",
                        () => { dBox.style.display = 'none'; currentCallback = null; }
                    ]);
                }
                return;
            }
        });

        // ------------------ 챕터 2 로직 ------------------
        function startChapter2() {
            tree.src = "assets/images/tree.gif"; 
            document.body.classList.remove('pixel-mode');
            isPixelMode = false;
            
            bgm2.pause(); bgm3.pause(); bgm4.pause();
            bgm.play().catch(()=>{});
            isBgmPlaying = true;

            runSequence([
                "* (음, 누군가 있다.)",
                "* (당신을 봐서 기쁜 것 같다.)",
                {
                    text: "* (어떻게 생각하는가?)",
                    opt1: "기뻐한다", opt2: "기뻐하지 않는다",
                    fn1: () => {
                        sndEgg.play().catch(()=>{});
                        runSequence([
                            "* (달걀을 획득했다.)",
                            () => manLeaves(2)
                        ]);
                    },
                    fn2: () => runSequence([
                        "* (음, 남자는 이제 여기 없다.)",
                        () => manLeaves(2)
                    ])
                }
            ]);
        }

        // ------------------ 챕터 3 로직 ------------------
        function startChapter3Meta() {
            bgm.pause(); bgm3.pause(); bgm4.pause();
            bgm2.play().catch(()=>{});
            isBgmPlaying = true;
            tree.src = "assets/images/tree2.gif";
            
            document.body.classList.add('pixel-mode');
            isPixelMode = true; 

            let seq = [
                "자,",
                "봄이 가고 여름이 오고, 여름이 지나 추위가 찾아왔건만,"
            ];

            if (timeInfo !== "") seq.push(timeInfo);
            if (metaInfo !== "") seq.push(metaInfo);
            
            seq.push(
                "여전히,",
                "나는 잊힌 남자란다.",
                {
                    text: "너도, 나를 잊어버릴 거지?",
                    opt1: "그렇다", opt2: "아니다",
                    fn1: beVoid,
                    fn2: () => {
                        isFocusTrapActive = true; 
                        
                        runSequence([
                            "정말로? 너는 이미 날 여러 번이나 잊어버렸는걸.",
                            "나와 다시 만난다 해도, 금세 잊고 말 테지.",
                            "가끔은 나조차도 나 자신을 잊어버리곤 하니까...",
                            {
                                text: "다시 한번 묻도록 하마. 너도 나를 잊어버릴 거지?",
                                opt1: "그렇다", opt2: "아니다",
                                fn1: beVoid,
                                fn2: () => {
                                    isFocusTrapActive = false; 
                                    
                                    runSequence([
                                        "날 기억해 주겠다고?",
                                        "음. 그렇다면, 그냥 잊어주렴.",
                                        "나는 그저 평범한 남자일 뿐이니까.",
                                        "내 이야기를 귀담아들어 보렴.",
                                        "옛날 옛적에, 온 세상은 이곳과 같은 모습이었단다.",
                                        {
                                            text: "너도 그렇게 생각하니?",
                                            opt1: "그렇다", opt2: "아니다",
                                            fn1: () => runSequence([
                                                "정말이니? 이런 터무니없는 이야기를 믿는다는 게야?",
                                                "그렇다니 참으로 기쁘구나. 이야기를 계속하마...",
                                                nextStoryNode1
                                            ]),
                                            fn2: () => runSequence([
                                                "당연히 아니겠지. 이건 그저 옛날이야기일 뿐이니까.",
                                                "자, 이야기를 계속하마...",
                                                nextStoryNode1
                                            ])
                                        }
                                    ]);
                                }
                            }
                        ]);
                    }
                }
            );
            runSequence(seq);
        }

        function nextStoryNode1() {
            runSequence([
                "음, 그 후 세상은 변했고, 사회가 생겨났지.",
                "땅이 물로 뒤덮이고, 공룡이 나타나고, 빙하기가 찾아오고,",
                "흠... 가만, 공룡은 지금도 있구나... 내가 착각했나?",
                "어찌 됐든, 이제, 내가 입을 열 수 있는 곳은 이 섬밖에 남지 않았단다.",
                {
                    text: "내 말을 이해할 수 있겠니?",
                    opt1: "그렇다", opt2: "아니다",
                    fn1: () => runSequence([
                        "재밌구나. 정작 나는 내 말이 무슨 뜻인지 하나도 모르겠거든.",
                        nextStoryNode2
                    ]),
                    fn2: () => runSequence([
                        "재밌구나. 나조차도 이해가 안 되거든.",
                        nextStoryNode2
                    ])
                }
            ]);
        }

        function nextStoryNode2() {
            runSequence([
                "하지만 언젠가, 이 섬 또한, 사라져 버리겠지.",
                "그렇게 되면 우린 두 번 다시 만날 수 없게 될 테고.",
                "...",
                {
                    text: "다시 만나고 싶었니?",
                    opt1: "그렇다", opt2: "아니다",
                    fn1: () => runSequence([
                        "아아, 기쁜 일이구나.",
                        "내 일정을 알려주마. 똑똑히 들어보렴.",
                        "목요일엔, 도넛을 팔러 간단다.",
                        "금요일엔, 안 팔리고 남은 것들을 쓰레기통에 버리지.",
                        "토요일엔, 창가에 도넛을 두고 식혀.",
                        "일요일엔, 밀을 거두러 간단다.",
                        "숨을 참고, 왼쪽으로 걸어가며, 100부터 거꾸로 세어보렴...",
                        {
                            text: "잘 받아 적었니?",
                            opt1: "그렇다", opt2: "아니다",
                            fn1: () => runSequence(["참으로 다정한 아이구나.", giveEggAgain]),
                            fn2: () => runSequence(["음, 벌써 잊기 시작한 모양이네.", giveEggAgain])
                        }
                    ]),
                    fn2: beVoid
                }
            ]);
        }

        function giveEggAgain() {
            runSequence([
                "나를 기억할 수 있게 이걸 가져가렴.",
                () => { sndEgg.play().catch(()=>{}); nextSequence(); },
                "* (크리스는 달걀을 받았다.)",
                "하지만, 날이 지나면 잃어버릴지도 모르니.",
                "꼭 어딘가에 잘 두도록 하렴.",
                {
                    text: "달걀은 부끄러워할 게 아니란다.",
                    opt1: "알겠다", opt2: "모르겠다",
                    fn1: finishStory,
                    fn2: finishStory
                }
            ]);
        }

        function finishStory() {
            runSequence([
                "자기 생각이 아주 뚜렷하구나.",
                "대견하구나!",
                "너는 나를 잊고, 나도 너를 잊어버릴지도 모르지만,",
                "그래도 네 다정함은 잊지 않으마.",
                "자, 이 섬은 곧 사라질 테니. 너도 이제 가보렴.",
                "네가 바란다면, 그곳에서 우린 다시 만날 수 있겠지...",
                "11시간이든 11년이든, 델타룬은 기다리고 있을 거란다.",
                "그러니 서두르지 말고, 세수도 하고, 옷도 잘 챙겨 입으렴!",
                () => manLeaves(3)
            ]);
        }

        // ------------------ 챕터 4 로직 ------------------
        function startChapter4() {
            tree.style.display = 'none';
            document.body.classList.remove('pixel-mode');
            isPixelMode = false;
            
            bgm.pause(); bgm2.pause(); bgm3.pause();
            bgm4.play().catch(()=>{});
            isBgmPlaying = true;

            runSequence([
                "* (크리스는 연필을 집어들었다.)",
                "* (나무 뒤에서 본 것을 스케치하는 것으로 그림을 시작했다.)",
                "* (하지만, 스케치를 하면서, 선들이 길을 잃은 듯, 어긋나기 시작했다.)",
                "* (크리스는 다시 그림을 그렸다. 이미 그어진 선 위에 선을 덧대며.)",
                "* (갑자기 그리는 것을 멈추거나, 원하는 대로 그려지지 않고 그림이 달라지는 경우도 많았다.)",
                "* (그럴 때마다, 크리스는 다시 그렸다, 몇 번이고, 몇 번이고, 계속해서.)",
                "* (수많은 반복 끝에, 크리스의 손놀림은 빠르고 부드러워져 갔다...)",
                "* (... 마지막에는 종이를 보지 않고도, 한 줄의 거친 선만으로 스케치를 완성했다.)",
                "* (...)",
                "* (결국, 겹겹이 스케치를 계속해서 쌓아올린 끝에...)",
                "* (... 캔버스의 표면은 그저 무채색의 번짐이 되어버렸다.)",
                "* (...)",
                "* (그 후, 그 위에는 나무가 그려졌다...)",
                "* (... 그 모든 것 위에 덧그려진...)",
                "* (... 한 점의 정물화만이 남았다.)",
                "* (... 애초에, 이 방에서 볼 수 있는 것이라곤 나무 한 그루뿐이었으니.)",
                "* (...)",
                "* (그림 그리기가 끝난 듯, 크리스는 일어났다.)",
                "* (...)",
                "* (하지만, 그 손은, 흑연이 짙게 묻은 채로...)",
                "* (... 계속 움직이고 있었다. 미처 보지 못한 것을 그리려는 것처럼.)",
                "* (당신은 캔버스의 질감에 감탄했다.)",
                () => { sndEgg.play().catch(()=>{}); nextSequence(); },
                "* (근처에 있는 이젤에서 달걀을 주웠다.)",
                "* (누군가가 나무 그림을 그리고 있는 모양이다.)",
                "* (하지만, 이상하게도, 아직 나무 껍질을 그리지 않은 듯하다.)",
                "* (개수대다.)",
                "* (그림을 그린 후에 손을 씻을 곳이 없다는 것은 말도 안되는 일이다.)",
                "* (당신은 손에 물을 흘려보냈고, 손을 말렸다.)",
                "* (손가락 사이로, 희미한 회색 자국 하나가 끝까지 남은 채 반짝였다.)",
                "* (... 모든 것을 씻어낼 수는 없는 법이다.)",
                () => manLeaves(4)
            ]);
        }

        // ------------------ 챕터 5 로직 ------------------
        function startChapter5Main() {
            tree.src = "assets/images/tree.gif";
            document.body.classList.remove('pixel-mode');
            isPixelMode = false;
            
            bgm.pause(); bgm2.pause(); bgm4.pause();
            bgm3.play().catch(()=>{});
            isBgmPlaying = true;

            runSequence([
                "* (음, 이곳에 한 남자가 있다.)",
                {
                    text: "* (그가 무언가를 건네려 한다.)",
                    opt1: "예", opt2: "아니요",
                    fn1: () => {
                        sndEgg.play().catch(()=>{});
                        runSequence([
                            "* (\"달걀\"을 손에 넣었다.)",
                            {
                                text: "* (지금까지 남자를 계속 만났었던가?)",
                                opt1: "예", opt2: "아니오",
                                fn1: () => ch5EggDialogue(true),
                                fn2: () => ch5EggDialogue(false)
                            }
                        ]);
                    },
                    fn2: () => runSequence([
                        "* (음, 남자는 여기에 없다.)",
                        () => manLeaves(5)
                    ])
                }
            ]);
        }

        function ch5EggDialogue(hasAllEggs) {
            runSequence([
                {
                    text: "* (어떻게 할까?)",
                    opt1: "더 요구한다", opt2: "요구하지 않는다",
                    fn1: () => hasAllEggs ? ch5RouteA() : ch5RouteX(),
                    fn2: () => hasAllEggs ? ch5RouteB() : ch5RouteX()
                }
            ]);
        }

        function ch5RouteA() { 
            runSequence([
                "* (음, 남자가 어깨 위로 살포시 손을 얹어왔다.)",
                "* (이윽고, 텅 빈 제 손바닥을 내보이더니...)",
                "* (입가에 검지를 댄 채, 미소 지으며 가만히 고개를 가로저었다.)",
                "* (당신은 이미 모든 것을 얻은 것 같다.)",
                "* (...)",
                "* (이윽고 찰나의 침묵 끝에, 시선을 살짝 빗기며 그는 작별을 고하듯 손을 흔들었다.)",
                "* (...)",
                "* (크리스는 왠지 모를 기묘한 서글픔에 잠겼다.)",
                "* (두 번 다시 그 남자를 쫓아선 안 될 것만 같은 예감이었다.)",
                "* (... 애당초 그랬던 적조차 없었음에도 말이다.)",
                () => manLeaves(5)
            ]);
        }

        function ch5RouteB() { 
            runSequence([
                "* (음, 남자가 어깨 위로 살포시 손을 얹어왔다.)",
                "* (이윽고, 텅 빈 제 손바닥을 내보이더니...)",
                "* (입가에 검지를 댄 채, 미소 지으며 가만히 고개를 끄덕였다.)",
                "* (당신은 이미 모든 것을 얻은 것 같다.)",
                "* (...)",
                "* (이윽고 찰나의 침묵 끝에, 시선을 살짝 빗기며 그는 작별을 고하듯 손을 흔들었다.)",
                "* (...)",
                "* (크리스는 왠지 모를 기묘한 서글픔에 잠겼다.)",
                "* (두 번 다시 그 남자를 쫓아선 안 될 것만 같은 예감이었다.)",
                "* (... 애당초 그랬던 적조차 없었음에도 말이다.)",
                () => manLeaves(5)
            ]);
        }

        function ch5RouteX() { 
            runSequence([
                "* (남자는 힘주어 고개를 끄덕였다.)",
                "* (그는 아스라이 먼 저편을 손가락으로 가리켰다.)",
                "* (그곳에는, 또 다른 나무가 자리하고 있었다.)",
                "* (실로, 여기 이 나무와 꼭 빼닮은 모습이었다.)",
                "* (고개를 빼꼼 내밀어 보니, 그 뒤로 또 다른 나무가 자리하고 있었다.)",
                "* (마치 끝없이 마주 보는 거울 속을 들여다보는 듯한 감각이었다...)",
                "* (머리가 빙빙 돌기 시작했다.)",
                "* (... 남자는 그 모습을 지켜보다 근심 어린 표정을 지었다.)",
                "* (그는 무언가 입을 떼려 했지만...)",
                "* (...)",
                "* (음, 남자는 가만히 미소 지었다.)",
                "* (그리고, 지금은 이만 안녕이라는 듯 가볍게 손을 흔들어 보였다.)",
                () => manLeaves(5)
            ]);
        }
        
        // ------------------ 초기화 로직 ------------------
        function init() {
            if (gameState === -1) { 
                beVoid(); 
                return; 
            }

            if (gameState === 5) {
                dBox.style.display = 'none'; 
                tree.src = "assets/images/tree.gif"; 
                return;
            }

            fetchTimeInfo();
            fetchMetaInfo();
            dBox.style.display = 'flex';

            if (gameState === 0) { 
                dText.innerText = "* (나무 뒤에 남자가 있다.)";
                isWaitingForClick = true;
                
                currentCallback = () => {
                    runSequence([
                        {
                            text: "* (그가 뭔가를 내밀었다.)",
                            opt1: "받는다", opt2: "받지 않는다",
                            fn1: () => {
                                sndEgg.play().catch(()=>{});
                                runSequence([
                                    "* (달걀을 받았다.)",
                                    "* (세상을 다시 그리면 무언가 변할지도 모른다.)",
                                    () => manLeaves(1)
                                ]);
                            },
                            fn2: () => runSequence(["* (그럼 그는 여기에 있을 필요가 없다.)", beVoid])
                        }
                    ]);
                };
            } 
            else if (gameState === 1) { 
                dText.innerText = "델타룬 챕터 2를 플레이하셨나요?";
                showChoices("예", "아니오", 
                    () => runSequence([{ text: "스포일러?", opt1: "예", opt2: "아니오", fn1: startChapter2, fn2: beVoid }]),
                    beVoid
                );
            } 
            else if (gameState === 2) { 
                dText.innerText = "델타룬 챕터 3을 플레이하셨나요?";
                showChoices("예", "아니오", 
                    () => runSequence([{ text: "스포일러?", opt1: "예", opt2: "아니오", fn1: startChapter3Meta, fn2: beVoid }]),
                    beVoid
                );
            }
            else if (gameState === 3) {
                dText.innerText = "델타룬 챕터 4를 플레이하셨나요?";
                showChoices("예", "아니오", 
                    () => runSequence([{ text: "스포일러?", opt1: "예", opt2: "아니오", fn1: startChapter4, fn2: beVoid }]),
                    beVoid
                );
            }
            else if (gameState === 4) { 
                dText.innerText = "델타룬 챕터 5를 플레이하셨나요?";
                showChoices("예", "아니오", 
                    () => runSequence([{ text: "스포일러?", opt1: "예", opt2: "아니오", fn1: startChapter5Main, fn2: beVoid }]),
                    beVoid
                );
            }
        }

        init();
    </script>
